
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NataFin - Tambah Transaksi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>

<body class="dashboard-page">

    <nav class="app-navbar">
        <div class="container-fluid px-3 px-lg-4 d-flex align-items-center">
            <button class="menu-toggle" type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#menuNataFin"
                aria-controls="menuNataFin"
                aria-label="Buka menu navigasi">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="brand-group">
                <span class="brand-placeholder" aria-hidden="true"></span>
                <a href="../../index.html" class="app-brand">NataFin</a>
            </div>
        </div>
    </nav>

    <div class="offcanvas offcanvas-start app-offcanvas"
        tabindex="-1" id="menuNataFin"
        aria-labelledby="menuNataFinLabel">

        <div class="offcanvas-header">
            <h2 class="offcanvas-title app-brand" id="menuNataFinLabel">NataFin</h2>
            <button type="button" class="btn-close"
                data-bs-dismiss="offcanvas" aria-label="Tutup menu"></button>
        </div>

        <div class="offcanvas-body">
            <p class="menu-heading">MENU UTAMA</p>
            <a href="../../index.html" class="menu-link">Dashboard</a>
            <a href="transaksi.html" class="menu-link active" aria-current="page">Tambah Transaksi</a>
            <a href="../keuangan/detail.html" class="menu-link">Detail Keuangan</a>

            <p class="menu-heading mt-4">AKUN</p>
            <a href="../akun/login.html" class="menu-link">Masuk</a>
            <a href="../akun/register.html" class="menu-link">Daftar</a>
            <a href="../akun/profil.html" class="menu-link">Profil</a>
            <a href="../akun/logout.html" class="menu-link">Keluar</a>
        </div>
    </div>

    <main class="container-fluid dashboard-container px-3 px-lg-4 py-4">
        <div class="dashboard-heading">
            <h1>Tambah Transaksi</h1>
        </div>

        <div id="transactionMessage" class="alert d-none"
            role="status" aria-live="polite"></div>

        <section class="card content-card shadow-sm border-0 mb-4">
            <div class="card-body p-3 p-md-4">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                    <h2 class="panel-title">Form Transaksi</h2>
                    <button type="button" id="toggleTransactionForm"
                        class="btn btn-outline-navy btn-sm">
                        Sembunyikan Form
                    </button>
                </div>

                <form id="transactionForm" novalidate>
                    <div id="transactionFormFields">
                        <div class="row g-3">
                            <div class="col-12 col-md-6">
                                <label for="transactionType" class="form-label">Jenis Transaksi</label>
                                <select id="transactionType" name="jenis" class="form-select">
                                    <option value="pengeluaran" selected>Pengeluaran</option>
                                    <option value="pemasukan">Pemasukan</option>
                                </select>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="transactionCategory" class="form-label">Kategori</label>
                                <select id="transactionCategory" name="kategori" class="form-select">
                                    <option value="Makanan">Makanan</option>
                                    <option value="Transportasi">Transportasi</option>
                                    <option value="Pendidikan">Pendidikan</option>
                                    <option value="Belanja">Belanja</option>
                                    <option value="Tagihan">Tagihan</option>
                                    <option value="Hiburan">Hiburan</option>
                                    <option value="Uang Saku">Uang Saku</option>
                                    <option value="Gaji">Gaji</option>
                                    <option value="Lainnya">Lainnya</option>
                                </select>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="transactionAmount" class="form-label">Nominal (Rp)</label>
                                <input type="number" id="transactionAmount" name="nominal"
                                    class="form-control" min="1" step="1"
                                    placeholder="Contoh: 25000">
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="transactionDate" class="form-label">Tanggal Transaksi</label>
                                <input type="date" id="transactionDate"
                                    name="tanggal" class="form-control">
                            </div>

                            <div class="col-12">
                                <label for="transactionDescription" class="form-label">Keterangan</label>
                                <textarea id="transactionDescription" name="keterangan"
                                    class="form-control" rows="3"
                                    placeholder="Contoh: Makan siang"></textarea>
                            </div>

                            <div class="col-12">
                                <button type="submit" class="btn btn-gold">Simpan Transaksi</button>
                                <button type="reset" class="btn btn-outline-navy ms-1">Kosongkan</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </section>

        <section class="card dashboard-card">
            <div class="card-body p-3 p-lg-4">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                    <h2 class="panel-title">Daftar Transaksi</h2>
                    <span id="transactionCount" class="text-secondary small">
                        0 transaksi ditampilkan
                    </span>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-12 col-md-8">
                        <label for="searchTransaction" class="form-label">Cari transaksi</label>
                        <input type="search" id="searchTransaction" class="form-control"
                            placeholder="Cari keterangan, kategori, atau tanggal">
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="filterType" class="form-label">Filter jenis</label>
                        <select id="filterType" class="form-select">
                            <option value="semua">Semua transaksi</option>
                            <option value="pemasukan">Pemasukan</option>
                            <option value="pengeluaran">Pengeluaran</option>
                        </select>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th scope="col">Tanggal</th>
                                <th scope="col">Keterangan</th>
                                <th scope="col">Kategori</th>
                                <th scope="col">Jenis</th>
                                <th scope="col" class="text-end">Nominal</th>
                                <th scope="col">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="allTransactionsBody"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <footer class="dashboard-footer">&copy; 2026 NataFin</footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../script.js"></script>
</body>

</html>
