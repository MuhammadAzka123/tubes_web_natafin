
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NataFin - Profil</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>

<body class="auth-shell-page">

    <nav class="app-navbar">
        <div class="container-fluid px-3 px-lg-4 d-flex align-items-center">
            <button class="menu-toggle" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#menuNataFin"
                aria-controls="menuNataFin" aria-label="Buka menu navigasi">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="brand-group">
                <span class="brand-placeholder" aria-hidden="true"></span>
                <a href="../../index.html" class="app-brand">NataFin</a>
            </div>
        </div>
    </nav>

    <div class="offcanvas offcanvas-start app-offcanvas"
        tabindex="-1" id="menuNataFin" aria-labelledby="menuNataFinLabel">
        <div class="offcanvas-header">
            <h2 class="offcanvas-title app-brand" id="menuNataFinLabel">NataFin</h2>
            <button type="button" class="btn-close"
                data-bs-dismiss="offcanvas" aria-label="Tutup menu"></button>
        </div>

        <div class="offcanvas-body">
            <p class="menu-heading">MENU UTAMA</p>
            <a href="../../index.html" class="menu-link">Dashboard</a>
            <a href="../transaksi/transaksi.html" class="menu-link">Tambah Transaksi</a>
            <a href="../keuangan/detail.html" class="menu-link">Detail Keuangan</a>

            <p class="menu-heading mt-4">AKUN</p>
            <a href="login.html" class="menu-link">Masuk</a>
            <a href="register.html" class="menu-link">Daftar</a>
            <a href="profil.html" class="menu-link active" aria-current="page">Profil</a>
            <a href="logout.html" class="menu-link">Keluar</a>
        </div>
    </div>

    <main class="auth-single-main">
        <section class="card auth-single-card">
            <div class="card-body p-4 p-md-5">
                <h1 class="auth-single-title">Profil</h1>

                <form id="profileForm" novalidate>
                    <div class="mb-3">
                        <label for="nama" class="form-label">Nama Lengkap</label>
                        <input type="text" class="form-control" id="nama"
                            name="nama" placeholder="Masukkan nama lengkap">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email"
                            name="email" placeholder="Masukkan email">
                    </div>

                    <div class="mb-4">
                        <label for="telepon" class="form-label">Nomor Telepon</label>
                        <input type="tel" class="form-control" id="telepon"
                            name="telepon" placeholder="Masukkan nomor telepon">
                    </div>

                    <div id="accountMessage" class="alert d-none"
                        role="status" aria-live="polite"></div>

                    <button type="submit" class="btn btn-gold w-100">
                        Simpan Perubahan
                    </button>
                </form>

                <p class="auth-single-switch">
                    <a href="../../index.html">Kembali ke Dashboard</a>
                </p>
            </div>
        </section>
    </main>

    <footer class="dashboard-footer">&copy; 2026 NataFin</footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../script.js"></script>
</body>

</html>
